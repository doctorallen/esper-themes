  <rect width="200" height="200" rx="28" fill="#F1E8C8" stroke="none"/>
  <!-- The Leaf of Lórien: an ivy-shaped mallorn leaf, a long blade to the point
       with a large lobe leaning forward on one side of the stem and a smaller
       one on the other, and the brooch's vine looped at the stem, run along the
       outer edge and looped again at the tip. Drawn with the blade along +x,
       then turned to run from the stem at upper right to the point at lower left. -->
