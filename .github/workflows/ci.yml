name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extension metadata and theme
        run: |
          node -e "const fs=require('fs'); for (const file of ['package.json','themes/LCARS-color-theme.json','themes/LCARS-Picard-color-theme.json','themes/LCARS-Troi-color-theme.json','themes/LCARS-Data-color-theme.json','themes/LCARS-Crusher-color-theme.json','themes/Q-color-theme.json']) JSON.parse(fs.readFileSync(file, 'utf8'));"
          node --check extension.js
          node --check q-theme.js

      - name: Build VSIX
        run: npm run package:vsix

      - name: Upload VSIX build artifact
        uses: actions/upload-artifact@v4
        with:
          name: esper-themes-vsix-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 7
